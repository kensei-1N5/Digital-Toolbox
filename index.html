function generatePassword(){let chars='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ'+($('#digits').checked?'23456789':'')+($('#symbols').checked?'!@#$%&*?_-+=':'');let arr=new Uint32Array(Number($('#len').value)),max=Math.floor(4294967296/chars.length)*chars.length,s='';while(s.length<arr.length){crypto.getRandomValues(arr);for(let x of arr){if(x<max)s+=chars[x%chars.length];if(s.length===arr.length)break}}$('#pwout').value=s;updatePasswordStrength(s,chars.length)}
function updatePasswordStrength(s,alphabet){const bits=s.length*Math.log2(alphabet),tier=bits<50?0:bits<75?1:bits<110?2:3;const labels=['Faible','Moyenne','Forte','Très forte'],colors=['#e74c3c','#f59e0b','#3b82f6','#16a34a'];$('#strengthLabel').textContent=labels[tier];$('#strengthLabel').style.color=colors[tier];$('#strengthFill').style.width=[25,50,75,100][tier]+'%';$('#strengthFill').style.background=colors[tier];$('#strengthInfo').textContent=`Environ ${Math.round(bits)} bits d’entropie théorique pour un mot de passe généré aléatoirement.`}

const defaultExpenseCategories=['Courses','Transport','Loisirs','Maison','Autre'];

function expenses(){content(`<div class="card stack"><h2>Ajouter une dépense</h2><div class="two"><div><label>Montant (€)</label><input id="amount" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="12,50"></div><div><label>Catégorie</label><select id="expCategory" class="field"></select></div></div><label>Description</label><input id="expDesc" class="field" placeholder="Ex. café"><button class="btn primary" onclick="addExpense()">Ajouter la dépense</button></div><details class="card exp-category-details" id="expenseCategoryDetails" ontoggle="saveExpenseCategoryPanel(this.open)"><summary>Catégories <span class="exp-category-hint" style="font-size:12px;font-weight:500;color:#8190a2;margin-left:auto">Gérer</span></summary><div class="exp-category-body stack"><div class="row"><input id="newExpCategory" class="field grow" maxlength="45" placeholder="Nouvelle catégorie"><button class="btn" onclick="addExpenseCategory()">+ Ajouter</button></div><div id="categoryManager" class="category-manager"></div><p class="exp-muted">Une catégorie utilisée par une dépense ne peut pas être supprimée. Supprime ou reclasse d’abord les dépenses concernées.</p></div></details><div class="card stack"><h2>Mes dépenses</h2><label>Filtrer par catégorie</label><select id="expFilter" class="field" onchange="drawExpenses()"></select><div class="two"><div><label>Total affiché</label><div class="result" id="total"></div></div><div><label>Total général</label><div class="result" id="allTotal"></div></div></div><div id="categoryShare" class="category-share" aria-live="polite"></div><div class="exp-actions"><button class="btn" onclick="exportExpensesExcel()">⬇ Exporter Excel</button><button class="btn danger" onclick="clearExpenses()">Tout supprimer</button></div><p class="exp-muted">L’export inclut toutes les dépenses, même si un filtre est actif.</p></div><div class="card" id="explist"></div>`);$('#expenseCategoryDetails').open=get('expenseCategoryPanelOpen',false);refr function drawCategoryManager(){const host=$('#categoryManager');if(!host)return;const cats=expenseCategories(),used=get('expenses',[]);host.innerHTML=cats.map(c=>{const count=used.filter(x=>x.category===c).length;return `<div class="category-manage-row"><span>${esc(c)} <small>(${count} dépense${count>1?'s':''})</small></span><button class="btn danger" ${count?'disabled title="Catégorie utilisée"':''} data-delete-category="${esc(c)}" aria-label="Supprimer la catégorie ${esc(c)}">Supprimer</button></div>`}).join('');host.querySelectorAll('[data-delete-category]').forEach(btn=>btn.addEventListener('click',()=>deleteExpenseCategory(btn.dataset.deleteCategory)))}

function exportExpensesExcel(){const rows=get('expenses',[]);if(!rows.length)return toast('Aucune dépense à exporter');const table=[['Date','Catégorie','Description','Montant (EUR)'],...rows.map(x=>[x.date||'',x.category||'',x.desc||'',Number(x.amount)||0])];const enc=new TextEncoder();const xmlEsc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');const sheet='<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+table.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>{const col=String.fromCharCode(65+j),ref=col+(i+1);return typeof v==='number'&&i>0?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`}).join('')+'</row>').join('')+'</sheetData></worksheet>';const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Dépenses" sheetId="1" r:id="rId1"/></sheets></workbook>'],['xl/_rels/workbook function dax(){daxCategory='Toutes';daxQuery='';content(`<section class="dax-hero"><div class="dax-mark"><svg class="brand-pbi" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="20" width="6" height="15" rx="2" fill="#E4A900"/><rect x="12" y="13" width="7" height="22" rx="2" fill="#F2C811"/><rect x="21" y="5" width="7" height="30" rx="2" fill="#F2C811"/><rect x="30" y="12" width="6" height="23" rx="2" fill="#D2A800"/></svg></div><h2>Formules DAX</h2><p>Power BI · ${daxData.length} fonctions et modèles · Exemples concrets et constructeur interactif</p></section><input class="search dax-search" id="daxSearch" type="search" placeholder="⌕  Rechercher : CALCULATE, dates, filtre…" aria-label="Rechercher une formule DAX" autocomplete="off"><div class="dax-filter" id="daxFilters"></div><div class="dax-count" id="daxCount"></div><div id="daxResults"></div><p class="dax-note">Bibliothèque pratique, non exhaustive. DAX utilise les noms de fonctions anglais. Les exemples utilisent des virgules comme séparateurs ; selon les paramètres régionaux de Power BI, il peut falloir les remplacer par des points-virgules. Les tables et mesures sont fictives : adapte-les à ton modèle. Les fonctions peuvent nécessiter un contexte de ligne, de filtre ou une table de dates appropriée.</p>`);$('#daxSearch').addEventListener('input',e=>{daxQuery=e.target.value;drawDax()});drawDax()}

function daxSplitArgs(body){let a=[],cur='',depth=0,quote=false;for(let i=0;i<body.length;i++){const c=body[i];if(c==='"'){if(quote&&body[i+1]==='"'){cur+='""';i++;continue}quote=!quote}if(!quote&&c==='(')depth++;if(!quote&&c===')')depth--;if(!quote&&c===','&&depth===0){a.push(cur.trim());cur='';continue}cur+=c}if(cur.trim())a.push(cur.trim());return a}
function daxParts(formula){const m=formula.match(/^([A-Za-z][A-Za-z0-9.]*)\((.*)\)$/s);return m?{name:m[1],args:daxSplitArgs(m[2])}:{name:'',args:[]}}
function daxDetail(i){const x=daxData[i],parts=daxParts(x[3]),labels=x[5];let fields=parts.args.map((a,j)=>`<label for="daxField-${i}-${j}">${j+1}. ${esc(labels[j]||'Argument '+(j+1))}</label><input id="daxField-${i}-${j}" data-daxarg="${j}" value="${esc(a)}" spellcheck="false" autocapitalize="off">`).join('');return `<details class="dax-detail"><summary>📖 Explication, arguments et exemple</summary><h4>À quoi sert cette fonction ?</h4><p>${esc(x[2])}</p><h4>Arguments</h4>${parts.args.length?parts.args.map((a,j)=>`<div class="dax-arg"><strong>${j+1}. ${esc(labels[j]||'Argument '+(j+1))}</strong><div><code>${esc(a)}</code></div></div>`).join(''):'<p class="dax-note">Cette fonction ne prend aucun argument.</p>'}<h4>Exemple concret</h4><div class="dax-scenario">${esc(x[4])}</div><div class="dax-builder"><strong>🛠️ Construire ma formule</strong><p class="dax-note">Modifie les arguments ci-dessous. Le constructeur assemble la syntaxe mais ne valide pas ton modèle Power BI.</p>${fields}<div class="dax-result" id="daxBuilt-${i}">${esc(x[3])}</div><button class="btn" type="button" data-daxcopy="${i}">⧉ Copier ma formule</button></div></details>`}
function daxBuild(i){const card=document.querySelector(`[data-dax-index="${i}"]`);if(!card)return '';const x=daxData[i],p=daxParts(x[3]);const args=[...card.querySelectorAll('[data-daxarg]')].map(n=>n.value);const result=p.name?p.name+'('+args.join(', ')+')':x[3];card.querySelector('#daxBuilt-'+i).textContent=result;return result}
function drawDax(){const q=excelNormalize(daxQuery.trim());const matches=daxData.map((x,i)=>({x,i})).filter(({x})=>(daxCategory==='Toutes'||x[0]===daxCategory)&&(!q||excelNormalize(x.slice(0,5).join(' ')).includes(q)));$('#daxFilters').innerHTML=daxCategories.map((c,i)=>`<button type="button" class="${c===daxCategory?'selected':''}" onclick="daxSelectCategory(daxCategories[${i}])">${esc(c)}</button>`).join('');$('#daxCount').textContent=`${matches.length} résultat${matches.length>1?'s':''} · ${daxData.length} entrées dans le répertoire`;$('#daxResults').innerHTML=matches.map(({x,i})=>`<article class="dax-card" data-dax-index="${i}"><div class="excel-top"><strong class="dax-name">${esc(x[1])}</strong><span class="dax-cat">${esc(x[0])}</span></div><p>${esc(x[2])}</p><code class="dax-code">${esc(x[3])}</code><button class="btn" type="button" data-daxformula="${esc(x[3])}">⧉ Copier l’exemple</button>${daxDetail(i)}</article>`).join('')||'<p class="dax-note">Aucun résultat. Essaie un autre mot-clé.</p>';$('#daxResults').querySelectorAll('[data-daxformula]').forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.daxformula)));$('#daxResults').querySelectorAll('[data-dax-index]').forEach(card=>{const i=Number(card.dataset.daxIndex);card.querySelectorAll('[data-daxarg]').forEach(inp=>inp.addEventListener('input',()=>daxBuild(i)));card.querySelector('[data-daxcopy]').addEventListener('click',()=>copyText(daxBuild(i)))})}


const themeMedia=window.matchMedia('(prefers-color-scheme: dark)');

function openSettings(){if($('#settings-modal'))return;const modal=document.createElement('div');modal.id='settings-modal';modal.className='settings-backdrop';modal.onclick=e=>{if(e.target===modal)closeSettings()};modal.innerHTML=`<section class="settings-panel" role="dialog" aria-modal="true" aria-label="Paramètres"><div class="settings-title"><span>⚙ Paramètres</span><button class="settings-close" onclick="closeSettings()" aria-label="Fermer">×</button></div><div class="settings-label">Apparence</div><div class="theme-options"><button class="theme-option" data-mode="light" onclick="setTheme('light')"><span class="theme-symbol">☀</span>Clair</button><button class="theme-option" data-mode="dark" onclick="setTheme('dark')"><span class="theme-symbol">☾</span>Sombre</button><button class="theme-option" data-mode="system" onclick="setTheme('system')"><span class="theme-symbol">◐</span>Système</button></div><p>Ton choix est enregistré sur cet iPhone. Tes notes, tâches et dépenses sont conservées.</p></section>`;document.body.appendChild(modal);updateThemeButtons()}
function closeSettings(){$('#settings-modal')?.remove()}
function updateThemeButtons(){document.querySelectorAll('.theme-option').forEach(el=>{const active=el.dataset.mode===get('theme','light');el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active))})}
function setTheme(mode){if(!['light','dark','system'].includes(mode))return;put('theme',mode);applyTheme();updateThemeButtons()}
themeMedia.addEventListener?.('change',()=>{if(get('theme','light')==='system')applyTheme()});applyTheme();
