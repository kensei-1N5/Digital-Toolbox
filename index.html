'use strict';const $=s=>document.querySelector(s),app=$('#app');const defs=[['calc','🧮','Calculatrice','Opérations rapides'],['convert','🔄','Convertisseurs','Unités et températures'],['todo','✅','To-do list','Mes tâches'],['notes','📝','Notes','Mes idées'],['percent','％','Pourcentages','TVA, remise, évolution'],['timer','⏱️','Chrono & minuteur','Mesurer le temps'],['password','🔐','Mots de passe','Générateur sécurisé'],['colors','🎨','Codes couleurs','HEX et RGB'],['expenses','💶','Dépenses','Suivi du budget'],['excel','📗','Formules Excel','Répertoire et recherche']];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem('tb_'+k))??d}catch{return d}},put=(k,v)=>localStorage.setItem('tb_'+k,JSON.stringify(v));let favorites=get('favorites',[]),current='home',chronoStart=0,chronoElapsed=0,chronoRunning=false,clock=null,timerEnd=0,timerRemaining=0,timerRunning=false,stream=null,qrLoop=null;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function setHead(title,sub=''){ $('#heading').textContent=title;$('#subtitle').textContent=sub;$('#subtitle').style.display=sub?'block':'none'}function nav(which){['home','favs'].forEach(x=>$('#nav-'+x).classList.toggle('active',x===which))}function cleanup(){if(clock)clearInterval(clock);clock=null;if(qrLoop)clearInterval(qrLoop);qrLoop=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}function home(fav=false){cleanup();current='home';nav(fav?'favs':'home');setHead('Digital Toolbox','Votre quotidien, simplifié.');app.innerHTML=`<input class="search" id="search" placeholder="🔎 Rechercher un outil…" aria-label="Rechercher un outil"><div class="tabs" style="margin-top:14px"><button class="${!fav?'active':''}" onclick="home(false)">Tous</button><button class="${fav?'active':''}" onclick="home(true)">★ Favoris</button></div><div c const units={Longueur:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},Masse:{kg:1,g:.001,lb:.45359237,oz:.028349523125},Volume:{L:1,mL:.001,'m³':1000,'gal (US)':3.785411784},Surface:{'m²':1,'km²':1e6,ha:1e4,'ft²':.09290304},Vitesse:{'km/h':1,'m/s':3.6,mph:1.609344},Température:{'°C':1,'°F':1,K:1}};let category='Longueur';function convert(){content(`<div class="tabs" id="cats">${Object.keys(units).map(c=>`<button onclick="category='${c}';convert()" class="${c===category?'active':''}">${c}</button>`).join('')}</div><div class="card stack"><label>Valeur à convertir</label><input class="field" id="v" inputmode="decimal" value="1" oninput="conversion()"><div class="two"><select class="field" id="from" onchange="conversion()"></select><select class="field" id="to" onchange="conversion()"></select></div><div class="result" id="converted"></div></div>`);let opts=Object.keys(units[category]);for(let id of ['from','to'])$('#'+id).innerHTML=opts.map(o=>`<option>${o}</option>`).join('');$('#to').selectedIndex=1;conversion()}function conversion(){let v=num($('#v').value),a=$('#from').value,b=$('#to').value,r;if(category==='Température'){let c=a==='°C'?v:a==='°F'?(v-32)*5/9:v-273.15;r=b==='°C'?c:b==='°F'?c*9/5+32:c+273.15}else r=v*units[category][a]/units[category][b];$('#converted').textContent=fmt(r)+' '+b}

function percent(){content(`<div class="card stack"><label>Valeur de départ</label><input id="base" class="field" type="number" inputmode="decimal" value="100" oninput="calcPercent()"><label>Pourcentage (%)</label><input id="rate" class="field" type="number" inputmode="decimal" value="20" oninput="calcPercent()"><div id="percentResults"></div></div>`);calcPercent()}function calcPercent(){let b=num($('#base').value),r=num($('#rate').value);$('#percentResults').innerHTML=`<div class="item">${fmt(r)} % de ${fmt(b)} <strong class="grow" style="text-align:right">${fmt(b*r/100)}</strong></div><div class="item">Après augmentation <strong class="grow" style="text-align:right">${fmt(b*(1+r/100))}</strong></div><div class="item">Après réduction <strong class="grow" style="text-align:right">${fmt(b*(1-r/100))}</strong></div><div class="item">Prix TTC (TVA ${fmt(r)} %) <strong class="grow" style="text-align:right">${fmt(b*(1+r/100))}</strong></div>`}
function msfmt(ms){let t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function timer(){chronoRunning=false;chronoElapsed=0;timerRunning=false;timerRemaining=0;content(`<div class="card"><h2>Chronomètre</h2><div class="big" id="chrono">00:00:00</div><div class="row"><button class="btn primary grow" id="chronoBtn" onclick="toggleChrono()">Démarrer</button><button class="btn" onclick="resetChrono()">Réinitialiser</button></div></div><div class="card"><h2>Minuteur</h2><div class="two"><div><label>Minutes</label><input class="field" id="mins" type="number" min="0" value="5" inputmode="numeric"></div><div><label>Secondes</label><input class="field" id="secs" type="number" min="0" max="59" value="0" inputmode="numeric"></div></div><div class="big" id="countdown">00:05:00</div><div class="row"><button class="btn primary grow" id="timerBtn" onclick="toggleTimer()">Démarrer</button><button class="btn" onclick="resetTimer()">Réinitialiser</button></div><p class="muted">Le minuteur doit rester ouvert pour garantir l'alerte sonore.</p></div>`);$('#mins').oninput=$('#secs').oninput=()=>{if(!timerRunning)$('#countdown').textContent=msfmt((num($('#mins').value)*60+num($('#secs').value))*1000)};clock=setInterval(tick,200)}function tick(){if(current!=='timer')return;if(chronoRunning)$('#chrono').textContent=msfmt(chronoElapsed+Date.now()-chronoStart);if(timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());$('#countdown').textContent=msfmt(timerRemaining);if(!timerRemaining){timerRunning=false;$('#timerBtn').textContent='Démarrer';toast('Minuteur terminé !');if(navigator.vibrate)navigator.vibrate([200,100,200]);alert('⏰ Minuteur terminé !')}}}function toggleChrono(){if(chronoRunning){chronoElapsed+=Date.now()-chronoStart;chronoRunning=false}else{chronoStart=Date.now();chronoRunning=true}$('#chronoBtn').textContent=chronoRunning?'Pause':'Démarrer'}function resetChrono(){chronoRunning=false;chronoElapsed=0;$('#chrono').textContent='00:00:00';$('#chronoBtn').textContent='Démarrer'}function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());timerRunning=false}else{if(!timerRemaining)timerRemaining=(num($('#mins').value)*60+num($('#secs').value))*1000;if(timerRemaining<=0)return toast('Choisis une durée');timerEnd=Date.now()+timerRemaining;timerRunning=true}$('#timerBtn').textContent=timerRunning?'Pause':'Reprendre'}function resetTimer(){timerRunning=false;timerRemaining=0;$('#timerBtn').textContent='Démarrer';$('#countdown').textContent=msfmt((num($('#mins').value)*60+num($('#secs').value))*1000)}
function password(){content(`<div class="card stack"><label>Longueur : <strong id="pwlen">20</strong> caractères</label><input id="len" type="range" min="8" max="64" value="20" oninput="$('#pwlen').textContent=this.value"><label><input id="symbols" type="checkbox" checked> Inclure des symboles</label><label><input id="digits" type="checkbox" checked> Inclure des chiffres</label><button class="btn primary" onclick="generatePassword()">Générer</button><textarea class="field" id="pwout" readonly style="min-height:90px"></textarea><button class="btn" onclick="copyText($('#pwout').value)">Copier le mot de passe</button><p class="muted">Génération locale avec une source aléatoire cryptographique.</p></div>`);generatePassword()}function generatePassword(){let chars='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ'+($('#digits').checked?'23456789':'')+($('#symbols').checked?'!@#$%&*?_-+=':'');let arr=new Uint32Array(Number($('#len').value)),max=Math.floor(4294967296/chars.length)*chars.length,s='';while(s.length<arr.length){crypto.getRandomValues(arr);for(let x of arr){if(x<max)s+=chars[x%chars.length];if(s.length===arr.length)break}}$('#pwout').value=s}async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copié !')}catch{toast('Copie indisponible')}}
function colors(){content(`<div class="card stack"><label>Choisis une couleur</label><input id="picker" type="color" class="field" value="#2584f9" oninput="showColor()"><div class="swatch" id="swatch"></div><label>HEX</label><div class="row"><input class="field grow" id="hex" value="#2584F9" oninput="hexColor()"><button class="btn" onclick="copyText($('#hex').value)">Copier</button></div><label>RGB</label><div class="row"><input class="field grow" id="rgb" readonly><button class="btn" onclick="copyText($('#rgb').value)">Copier</button></div></div>`);showColor()}function showColor(){let h=$('#picker').value.toUpperCase();$('#hex').value=h;$('#swatch').style.background=h;$('#rgb').value='rgb('+[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(', ')+')'}function hexColor(){let h=$('#hex').value;if(/^#[0-9a-fA-F]{6}$/.test(h)){$('#picker').value=h;showColor()}}
function expenses(){content(`<div class="card stack"><div class="two"><div><label>Montant (€)</label><input id="amount" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="12,50"></div><div><label>Catégorie</label><select id="expCategory" class="field"><option>Courses</option><option>Transport</option><option>Loisirs</option><option>Maison</option><option>Autre</option></select></div></div><label>Description</label><input id="expDesc" class="field" placeholder="Ex. café"><button class="btn primary" onclick="addExpense()">Ajouter la dépense</button></div><div class="card"><label>Total enregistré</label><div class="result" id="total"></div></div><div class="card" id="explist"></div>`);drawExpenses()}function addExpense(){let a=Number($('#amount').value);if(!Number.isFinite(a)||a<=0)return toast('Montant invalide');let items=get('expenses',[]);items.unshift({id:crypto.randomUUID(),amount:Math.round(a*100)/100,category:$('#expCategory').value,desc:$('#expDesc').value.trim(),date:new Date().toLocaleDateString('fr-FR')});put('expenses',items);$('#amount').value='';$('#expDesc').value='';drawExpenses()}function drawExpenses(){let a=get('expenses',[]);$('#total').textContent=money(a.reduce((s,x)=>s+x.amount,0));$('#explist').innerHTML=a.map(x=>`<div class="item"><div class="grow"><strong>${esc(x.desc||x.category)}</strong><div class="muted">${esc(x.category)} · ${esc(x.date)}</div></div><strong>${money(x.amount)}</strong><button class="btn danger" onclick="deleteExpense('${x.id}')">×</button></div>`).join('')||'<p>Aucune dépense enregistrée.</p>'}function deleteExpense(id){put('expenses',get('expenses',[]).filter(x=>x.id!==id));drawExpenses()}

function splitExcelArgs(s){let a=[],cur='',depth=0,quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){cur+='""';i++;continue}quote=!quote}if(!quote&&c==='(')depth++;if(!quote&&c===')')depth--;if(!quote&&c===';'&&depth===0){a.push(cur.trim());cur='';continue}cur+=c}if(cur.trim())a.push(cur.trim());return a}
function excelParts(formula){let match=formula.match(/^=([^()]+)\((.*)\)$/);if(!match)return {name:'',args:[],tail:''};let body=match[2],level=0,quote=false,stop=-1;for(let i=0;i<body.length;i++){let c=body[i];if(c==='"')quote=!quote;if(!quote&&c==='(')level++;if(!quote&&c===')'&&level===0){stop=i;break}if(!quote&&c===')')level--}return {name:match[1],args:splitExcelArgs(body),tail:''}}
function excelArgumentLabel(value,i){if(/^\"/.test(value))return 'Texte ou critère';if(/^[A-Z]+\d+:[A-Z]+\d+$/i.test(value))return 'Plage de cellules';if(/^\$?[A-Z]+\$?\d+$/i.test(value))return 'Référence de cellule';if(/^[\d.,%-]+$/.test(value))return 'Nombre ou paramètre';if(/^[A-Z]+\(/i.test(value))return 'Expression ou fonction imbriquée';return 'Argument '+(i+1)}
function excelDetail(i){let x=excelData[i],guide=excelGuides[x[1]]||{},parsed=excelParts(x[3]),labels=parsed.args.map((a,j)=>(guide.args||[])[j]||excelArgumentLabel(a,j));let fields=parsed.args.map((a,j)=>`<label for="excelField-${i}-${j}">${j+1}. ${esc(labels[j])}</label><input id="excelField-${i}-${j}" data-arg="${j}" value="${esc(a)}" spellcheck="false" autocapitalize="off">`).join('');return `<details class="excel-detail"><summary>📖 Explication, arguments et exemple</summary><h4>À quoi sert cette formule ?</h4><p>${esc(x[2])}</p><h4>Comprendre les arguments</h4>${parsed.args.length?parsed.args.map((a,j)=>`<div class="excel-arg"><strong>${j+1}. ${esc(labels[j])}</strong><br><code>${esc(a)}</code></div>`).join(''):'<p class="excel-note">Cette fonction ne nécessite aucun argument.</p>'}<h4>Exemple concret</h4><div class="excel-scenario">${esc(guide.scenario||('Exemple prêt à adapter : '+x[3]+' — '+x[2]+' Remplace les références de cellules par celles de ton fichier.'))}</div><div class="excel-builder"><strong>🛠️ Construire ma formule</strong><p class="excel-note">Modifie les arguments ci-dessous puis copie la formule obtenue.</p>${fields}<div class="excel-result" id="excelBuilt-${i}">${esc(x[3])}</div><button class="btn" type="button" data-buildcopy="${i}">⧉ Copier ma formule</button></div><p class="excel-note">Les arguments et résultats dépendent de tes données. Vérifie la formule dans ta version d’Excel.</p></details>`}
function excelBuild(i){let card=document.querySelector(`[data-excel-index="${i}"]`);if(!card)return;let args=[...card.querySelectorAll('[data-arg]')].map(n=>n.value);let x=excelData[i],name=x[1],formula=args.length?'='+name+'('+args.join(';')+')':x[3];card.querySelector('#excelBuilt-'+i).textContent=formula;return formula}
function drawExcel(){let q=excelNormalize(excelQuery.trim());let rows=excelData.map((x,i)=>({x,i})).filter(({x})=>(excelCategory==='Toutes'||x[0]===excelCategory)&&(!q||excelNormalize(x.join(' ')).includes(q)));$('#excelFilters').innerHTML=excelCategories.map((c,i)=>`<button type="button" class="${c===excelCategory?'selected':''}" onclick="excelSelectCategory(excelCategories[${i}])">${esc(c)}</button>`).join('');$('#excelCount').textContent=`${rows.length} formule${rows.length>1?'s':''} trouvée${rows.length>1?'s':''} · ${excelData.length} dans le répertoire`;$('#excelResults').innerHTML=rows.map(({x,i})=>`<article class="excel-card" data-excel-index="${i}"><div class="excel-top"><span class="excel-name">${esc(x[1])}</span><span class="excel-cat">${esc(x[0])}</span></div><p>${esc(x[2])}</p><code class="excel-code">${esc(x[3])}</code><button class="btn" type="button" data-formula="${esc(x[3])}">⧉ Copier la formule</button>${excelDetail(i)}</article>`).join('')||'<div class="excel-empty">Aucune formule trouvée. Essaie un autre mot-clé.</div>';$('#excelResults').querySelectorAll('[data-formula]').forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.formula)));$('#excelResults').querySelectorAll('[data-excel-index]').forEach(card=>{let i=Number(card.dataset.excelIndex);card.querySelectorAll('[data-arg]').forEach(inp=>inp.addEventListener('input',()=>excelBuild(i)));card.querySelector('[data-buildcopy]').addEventListener('click',()=>copyText(excelBuild(i)))})}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home(false);
